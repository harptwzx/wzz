name: Resurgam OS Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential nasm qemu-system-x86 xorriso

    - name: Download prebuilt i686-elf cross compiler
      run: |
        mkdir -p ~/opt/cross
        wget -q https://github.com/lordmilko/i686-elf-tools/releases/download/13.2.0/i686-elf-tools-linux.zip
        unzip -q i686-elf-tools-linux.zip -d ~/opt/cross
        chmod +x ~/opt/cross/bin/*

    - name: Verify toolchain
      run: |
        export PATH="$HOME/opt/cross/bin:$PATH"
        i686-elf-gcc --version
        i686-elf-ld --version

    - name: Build Resurgam OS
      working-directory: Resurgam
      env:
        BUILD_TYPE: ${{ github.event.inputs.build_type }}
      run: |
        export PATH="$HOME/opt/cross/bin:$PATH"
        make clean
        make all BUILD_TYPE=$BUILD_TYPE

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Resurgam-OS-Build-${{ github.event.inputs.build_type }}
        path: |
          build/boot.bin
          build/stage2.bin
          build/kernel.bin
          build/resurgam.img
        if-no-files-found: error