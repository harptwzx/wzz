name: Build Resurgam OS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex libgmp3-dev \
          libmpc-dev libmpfr-dev texinfo nasm qemu-system-x86 xorriso \
          grub-common wget

    - name: Build i686-elf cross compiler
      run: |
        export PREFIX="$HOME/opt/cross"
        export TARGET=i686-elf
        export PATH="$PREFIX/bin:$PATH"
        
        mkdir -p $PREFIX
        mkdir -p /tmp/cross-build
        cd /tmp/cross-build
        
        # Download sources
        wget -q https://ftp.gnu.org/gnu/binutils/binutils-2.40.tar.xz
        wget -q https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.xz
        
        # Build binutils
        tar -xf binutils-2.40.tar.xz
        mkdir build-binutils && cd build-binutils
        ../binutils-2.40/configure --target=$TARGET --prefix="$PREFIX" \
          --with-sysroot --disable-nls --disable-werror
        make -j$(nproc)
        make install
        cd ..
        
        # Build GCC
        tar -xf gcc-13.2.0.tar.xz
        mkdir build-gcc && cd build-gcc
        ../gcc-13.2.0/configure --target=$TARGET --prefix="$PREFIX" \
          --disable-nls --enable-languages=c,c++ --without-headers
        make -j$(nproc) all-gcc
        make -j$(nproc) all-target-libgcc
        make install-gcc
        make install-target-libgcc
        
        echo "$PREFIX/bin" >> $GITHUB_PATH

    - name: Verify toolchain
      run: |
        i686-elf-gcc --version
        i686-elf-ld --version
        nasm -v

    - name: Build Resurgam OS
      run: |
        make clean
        make all

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Resurgam-OS-Build
        path: |
          build/boot.bin
          build/stage2.bin
          build/kernel.bin
          build/resurgam.img
          build/resurgam.iso

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Resurgam OS v1.0.${{ github.run_number }}
        body: |
          Automated build of Resurgam OS
          
          ## Files
          - `resurgam.img` - Floppy disk image
          - `resurgam.iso` - Bootable ISO image
          - `kernel.bin` - Raw kernel binary
          
          ## Usage
          Run with QEMU:
          ```bash
          qemu-system-i386 -fda resurgam.img -m 32M
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
